<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RadialFiles</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="dial-wrapper">
    <!-- SVG that renders the pie slices -->
    <svg id="radial-svg" viewBox="-160 -160 320 320">
      <g id="slices-group"></g>
    </svg>

    <!-- Center hub showing current hovered action or file info -->
    <div id="center-hub">
      <div id="hub-icon">⚡</div>
      <div id="hub-label">RadialFiles</div>
      <div id="hub-sub">Press 1-8 or hover</div>
    </div>
  </div>

  <script src="dial.js"></script>
</body>
</html>
